name: huashan-lungu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-huashan}
      POSTGRES_USER: ${DB_USER:-huashan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-huashan_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/leaarningandthinking/huashan-stock-analysis/backend}:${APP_VERSION:-v0.1.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-huashan}:${DB_PASSWORD:-huashan_dev}@postgres:5432/${DB_NAME:-huashan}
      REDIS_URL: redis://redis:6379/0
      SKILL_DIR: /app/skills/huashan-lungu-v2
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret-change-me}
      AUTH_SECRET: ${AUTH_SECRET:-local-auth-secret-change-me}
      PASSWORD_HASH_PEPPER: ${PASSWORD_HASH_PEPPER:-local-password-pepper-change-me}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/leaarningandthinking/huashan-stock-analysis/frontend}:${APP_VERSION:-v0.1.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_DIST_DIR: .next-build
      NEXT_PUBLIC_API_BASE: http://localhost:3000
      API_BASE_INTERNAL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
